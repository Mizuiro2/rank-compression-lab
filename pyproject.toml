[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rank-compression-lab"
version = "0.1.0"
description = "Reproducible CPU ranking-model distillation, structural pruning, and int8 experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Qingquan Wang"}]
dependencies = ["torch==2.8.0", "numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
rank-compress = "rank_compression_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
